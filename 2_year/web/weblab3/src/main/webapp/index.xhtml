<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Лабораторная работа №3</title>
    <link rel="stylesheet" href="css/style.css"/>
</h:head>
<h:body>
    <div class="header">
        <div class="name">Ибрагимова Айгуль Ильгизовна | P3211</div>
        <div class="isu">| ИСУ: 408675</div>
        <div class="var">| Вариант: 21040</div>
    </div>
    <!-- Панель с текущей датой и временем -->
    <div class="datetime-container">
        <div class="datetime" id="current-datetime"></div>
    </div>

    <div class="clock">
        <div class="hour">
            <div class="hours"></div>
        </div>
        <div class="minute">
            <div class="minutes"></div>
        </div>
        <div class="second">
            <div class="seconds"></div>
        </div>
    </div>
    <h:form>
        <div class="button-container">
                <h:button class="button-go-main" outcome="go-main" value="На главную"/>
        </div>
    </h:form>
    <script src="js/index.js" type=""></script>
</h:body>
</html>
